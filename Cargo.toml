[workspace]
members = [
    "crates/dustroute-minecraft",
    "crates/dustroute-physical",
    "crates/dustroute-ir",
    "crates/dustroute-translate",
    "crates/dustroute-optimize",
    "crates/dustroute-app",
    "crates/dustroute-mcp",
    "crates/dustroute-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sugipamo/DustRoute"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
