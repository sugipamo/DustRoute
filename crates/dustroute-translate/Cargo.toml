[package]
name = "dustroute-translate"
description = "Bidirectional logical circuit and Minecraft translation for DustRoute"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dustroute-ir = { path = "../dustroute-ir" }
dustroute-minecraft = { path = "../dustroute-minecraft" }
dustroute-physical = { path = "../dustroute-physical" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
