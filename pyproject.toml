[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dustroute"
version = "0.1.0"
description = "Logic-to-physical compiler and validator for Minecraft Java Edition redstone circuits"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/sugipamo/DustRoute"
Repository = "https://github.com/sugipamo/DustRoute.git"
Issues = "https://github.com/sugipamo/DustRoute/issues"

[tool.setuptools.packages.find]
include = ["dustroute*"]
